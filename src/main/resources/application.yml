server:
  port: 8083

spring:
  application:
    name: payment-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5435/payments}
    username: ${DATABASE_USER:payment_service}
    password: ${DATABASE_PASSWORD:payment_service}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

# Downstream services this service calls.
services:
  notification:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
